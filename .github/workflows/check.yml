name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Bundle Revisita Worker without deployment or credentials
        run: npx --yes wrangler@4.105.0 deploy --dry-run --config cloudflare/revisita-push/wrangler.toml
